# Lokální Postgres pro vývoj a testy aplikace (produkce: např. Neon). Spuštění: cd aplikace && npm run db:up
# Port jde změnit proměnnou RODOKMEN_DB_PORT (pak upravte i DATABASE_URL a TEST_DATABASE_URL v .env).
name: rodokmen
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rodokmen
      POSTGRES_PASSWORD: rodokmen
      POSTGRES_DB: rodokmen
    ports:
      - "${RODOKMEN_DB_PORT:-5433}:5432"
    volumes:
      - rodokmen-db:/var/lib/postgresql/data
      - ./aplikace/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rodokmen"]
      interval: 2s
      retries: 30
volumes:
  rodokmen-db:
